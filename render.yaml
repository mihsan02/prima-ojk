services:
  - type: web
    name: prima-ojk
    env: python
    rootDir: prima-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "false"