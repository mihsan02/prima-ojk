name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.1'

      - name: Install dependencies
        run: |
          cd prima-backend
          pip install -r requirements-dev.txt

      - name: Dry-run resolve (catch transitive drift before it hits Render)
        run: |
          cd prima-backend
          pip install --dry-run --ignore-installed -r requirements.txt

      - name: Run pytest
        run: |
          cd prima-backend
          python -m pytest -q --ignore=test_api.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range (push)
        if: github.event_name == 'push'
        id: range
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "opts=--all -n 1" >> "$GITHUB_OUTPUT"
          else
            echo "opts=${BEFORE}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks - push (new commits only)
        if: github.event_name == 'push'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --log-opts="${{ steps.range.outputs.opts }}" --redact -v .

      - name: Gitleaks - pull_request (diff against base only)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact -v .
